      <stop offset="1" stop-color="#31B8FF"/>
    </linearGradient>
    <linearGradient id="darkGradient" x1="370" y1="100" x2="640" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A3C45"/>
