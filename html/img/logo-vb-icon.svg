<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Logo VB</title>
  <desc id="desc">Monograma VB com referência a código e circuitos, em gradiente roxo e azul.</desc>
  <defs>
    <linearGradient id="mainGradient" x1="160" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9B4DFF"/>
